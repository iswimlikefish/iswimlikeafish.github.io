<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Trek: The Next Generation — Quote Generator</title>
    <style>
        /* Theme variables for Light and Dark modes */
        :root {
            --bg-overlay: rgba(244, 246, 250, 0.86);
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-color: #111827;
            --muted-color: #4b5563;
            --border-color: rgba(17, 24, 39, 0.14);
            --btn-bg: #1e293b;
            --btn-text: #ffffff;
            --slider-track: #cbd5e1;
        }

        body.dark-mode {
            --bg-overlay: rgba(8, 12, 24, 0.72);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --border-color: rgba(248, 250, 252, 0.16);
            --btn-bg: #eab308;
            --btn-text: #0f172a;
            --slider-track: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            position: relative;
            transition: color 0.3s ease;
        }

        /* Full-screen SVG background & readability tint */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-overlay);
            transition: background 0.3s ease;
        }

        main {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(6px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        /* Minimal Dark Mode Slider Toggle */
        .theme-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--muted-color);
            cursor: pointer;
            user-select: none;
        }

        .theme-switch input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: relative;
            width: 42px;
            height: 22px;
            background-color: var(--slider-track);
            border-radius: 999px;
            transition: background-color 0.3s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .theme-switch input:checked + .slider::before {
            transform: translateX(20px);
        }

        figure {
            margin: 0 0 2rem 0;
            min-height: 6.5rem;
        }

        blockquote {
            font-size: 1.15rem;
            margin: 0 0 0.75rem 0;
        }

        figcaption {
            font-size: 0.95rem;
            color: var(--muted-color);
        }

        button {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.55rem 1.15rem;
            border: none;
            border-radius: 6px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            transition: opacity 0.2s ease, background-color 0.3s ease, color 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Reliable inline SVG illustration: USS Enterprise-D in deep space -->
    <svg class="bg-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
            <radialGradient id="spaceGrad" cx="72%" cy="32%" r="85%">
                <stop offset="0%" stop-color="#1e293b"/>
                <stop offset="48%" stop-color="#0b132b"/>
                <stop offset="100%" stop-color="#030712"/>
            </radialGradient>
            <radialGradient id="nebulaGlow" cx="25%" cy="75%" r="55%">
                <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
                <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="planetGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="55%" stop-color="#1d4ed8"/>
                <stop offset="100%" stop-color="#090d16"/>
            </radialGradient>
            <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e2e8f0"/>
                <stop offset="50%" stop-color="#94a3b8"/>
                <stop offset="100%" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="nacelleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="18%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
        </defs>

        <!-- Deep space backdrop & nebula -->
        <rect width="1600" height="900" fill="url(#spaceGrad)"/>
        <rect width="1600" height="900" fill="url(#nebulaGlow)"/>

        <!-- Starfield -->
        <g fill="#ffffff">
            <circle cx="140" cy="110" r="1.5" opacity="0.8"/>
            <circle cx="290" cy="240" r="1" opacity="0.6"/>
            <circle cx="420" cy="85" r="2" opacity="0.9"/>
            <circle cx="560" cy="310" r="1.2" opacity="0.7"/>
            <circle cx="710" cy="140" r="1.6" opacity="0.85"/>
            <circle cx="880" cy="95" r="1" opacity="0.5"/>
            <circle cx="1020" cy="210" r="2.2" opacity="0.9"/>
            <circle cx="1420" cy="130" r="1.5" opacity="0.8"/>
            <circle cx="1510" cy="290" r="1.2" opacity="0.6"/>
            <circle cx="190" cy="480" r="1.8" opacity="0.85"/>
            <circle cx="340" cy="670" r="1.2" opacity="0.6"/>
            <circle cx="490" cy="540" r="1.5" opacity="0.75"/>
            <circle cx="660" cy="780" r="2" opacity="0.9"/>
            <circle cx="830" cy="640" r="1" opacity="0.5"/>
            <circle cx="980" cy="810" r="1.6" opacity="0.8"/>
            <circle cx="1150" cy="720" r="1.4" opacity="0.7"/>
            <circle cx="1360" cy="650" r="2.1" opacity="0.85"/>
            <circle cx="1490" cy="820" r="1.3" opacity="0.65"/>
            <circle cx="95" cy="790" r="1.7" opacity="0.75"/>
            <circle cx="1230" cy="95" r="1.3" opacity="0.7"/>
        </g>

        <!-- Distant Class-M Planet -->
        <circle cx="1340" cy="260" r="230" fill="url(#planetGrad)"/>
        <path d="M1110,275 A230,230 0 0,0 1568,245 A240,210 0 0,1 1110,275 Z" fill="#93c5fd" opacity="0.18"/>

        <!-- USS Enterprise-D (Galaxy-class silhouette) -->
        <g transform="translate(360, 310) rotate(-11) scale(1.15)">
            <!-- Far Warp Nacelle -->
            <rect x="45" y="42" width="235" height="22" rx="11" fill="url(#hullGrad)"/>
            <rect x="55" y="48" width="205" height="6" rx="3" fill="url(#nacelleGlow)"/>
            <!-- Far Nacelle Pylon -->
            <polygon points="185,64 215,64 245,115 215,115" fill="#64748b"/>

            <!-- Engineering / Secondary Hull -->
            <path d="M180,108 L355,102 C380,102 385,134 355,138 L195,134 Z" fill="url(#hullGrad)"/>
            <!-- Navigational Deflector Dish -->
            <ellipse cx="366" cy="120" rx="8" ry="15" fill="#38bdf8"/>
            <ellipse cx="367" cy="120" rx="4" ry="9" fill="#e0f2fe"/>

            <!-- Dorsal Neck -->
            <polygon points="285,104 335,104 360,76 310,76" fill="#94a3b8"/>

            <!-- Near Nacelle Pylon -->
            <polygon points="170,132 205,132 165,182 135,182" fill="#94a3b8"/>
            <!-- Near Warp Nacelle -->
            <rect x="20" y="176" width="250" height="26" rx="13" fill="url(#hullGrad)"/>
            <rect x="30" y="183" width="220" height="8" rx="4" fill="url(#nacelleGlow)"/>
            <!-- Bussard Collector Tip -->
            <path d="M250,176 C268,176 274,189 274,189 C274,189 268,202 250,202 Z" fill="#ef4444"/>

            <!-- Primary Hull (Saucer Section) -->
            <ellipse cx="375" cy="68" rx="155" ry="44" fill="url(#hullGrad)"/>
            <ellipse cx="375" cy="65" rx="122" ry="30" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
            <ellipse cx="375" cy="62" rx="82" ry="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
            <!-- Main Bridge Dome -->
            <ellipse cx="375" cy="56" rx="28" ry="7" fill="#f8fafc"/>
            <!-- Saucer Impulse Engines & Running Lights -->
            <rect x="228" y="64" width="14" height="5" rx="2" fill="#ef4444"/>
            <circle cx="525" cy="68" r="2.5" fill="#38bdf8"/>
        </g>
    </svg>

    <main>
        <header>
            <h1>Star Trek: The Next Generation</h1>
            <label class="theme-switch" for="dark-mode-toggle">
                <span id="theme-label">Dark Mode</span>
                <input type="checkbox" id="dark-mode-toggle" aria-label="Toggle dark mode">
                <span class="slider"></span>
            </label>
        </header>

        <figure>
            <blockquote id="quote-text"></blockquote>
            <figcaption id="quote-author"></figcaption>
        </figure>

        <button id="new-quote-btn" type="button">Generate Quote</button>
    </main>

    <script>
        // Collection of iconic Star Trek: The Next Generation quotes
        const tngQuotes = [
            {
                text: "It is possible to commit no mistakes and still lose. That is not a weakness. That is life.",
                author: "Captain Jean-Luc Picard"
            },
            {
                text: "Things are only impossible until they're not.",
                author: "Captain Jean-Luc Picard"
            },
            {
                text: "There are four lights!",
                author: "Captain Jean-Luc Picard"
            },
            {
                text: "The first duty of every Starfleet officer is to the truth, whether it's scientific truth or historical truth or personal truth!",
                author: "Captain Jean-Luc Picard"
            },
            {
                text: "I am fully functional, programmed in multiple techniques.",
                author: "Lieutenant Commander Data"
            },
            {
                text: "Could you please continue the petty bickering? I find it most intriguing.",
                author: "Lieutenant Commander Data"
            },
            {
                text: "In the strict sense, I did not. I merely utilized the available data to extrapolate a logical conclusion.",
                author: "Lieutenant Commander Data"
            },
            {
                text: "A blind man teaching an android how to paint? That's got to be worth a couple of pages in somebody's book.",
                author: "Commander William T. Riker"
            },
            {
                text: "Fate protects fools, little children, and ships named Enterprise.",
                author: "Commander William T. Riker"
            },
            {
                text: "Today is a good day to die.",
                author: "Lieutenant Worf"
            },
            {
                text: "I am NOT a merry man!",
                author: "Lieutenant Worf"
            },
            {
                text: "A warrior does not let a friend face danger alone.",
                author: "Lieutenant Worf"
            },
            {
                text: "Sometimes you just have to bow to the absurd.",
                author: "Lieutenant Commander Geordi La Forge"
            },
            {
                text: "You can't just sit back and wait for things to happen. You have to make them happen.",
                author: "Lieutenant Commander Geordi La Forge"
            },
            {
                text: "If there's nothing wrong with me, maybe there's something wrong with the universe.",
                author: "Dr. Beverly Crusher"
            },
            {
                text: "You've got to know when to break the rules, Jean-Luc.",
                author: "Dr. Beverly Crusher"
            },
            {
                text: "I don't know if I can help you, but I can certainly listen.",
                author: "Counselor Deanna Troi"
            },
            {
                text: "You can't measure a person's worth by their mistakes alone.",
                author: "Counselor Deanna Troi"
            },
            {
                text: "The trial never ends, Captain. We never reached a verdict.",
                author: "Q"
            },
            {
                text: "If you can't take a little bloody nose, maybe you ought to go back home and crawl under your bed. It's not safe out here.",
                author: "Q"
            },
            {
                text: "Consider that in the history of many worlds there have always been disposable creatures. They do the dirty work. They do the work that no one else wants to do, because it's too difficult or too hazardous.",
                author: "Guinan"
            },
            {
                text: "If you're going to be a captain, you have to learn to live with the fact that you can't save everyone.",
                author: "Guinan"
            }
        ];

        const quoteTextEl = document.getElementById("quote-text");
        const quoteAuthorEl = document.getElementById("quote-author");
        const newQuoteBtn = document.getElementById("new-quote-btn");
        const darkModeToggle = document.getElementById("dark-mode-toggle");

        let currentIndex = -1;

        /**
         * Applies or removes dark mode styling on the document body.
         */
        function setDarkMode(isDark) {
            document.body.classList.toggle("dark-mode", isDark);
            darkModeToggle.checked = isDark;
        }

        // Toggle theme when the slider changes
        darkModeToggle.addEventListener("change", (event) => {
            setDarkMode(event.target.checked);
        });

        // Respect OS dark mode preference on initial load
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            setDarkMode(true);
        }

        /**
         * Selects a random quote index guaranteed to be different from the current one,
         * and updates the DOM.
         */
        function displayRandomQuote() {
            if (tngQuotes.length === 0) return;

            let nextIndex;
            if (tngQuotes.length === 1) {
                nextIndex = 0;
            } else {
                do {
                    nextIndex = Math.floor(Math.random() * tngQuotes.length);
                } while (nextIndex === currentIndex);
            }

            currentIndex = nextIndex;
            const selectedQuote = tngQuotes[currentIndex];

            quoteTextEl.textContent = `“${selectedQuote.text}”`;
            quoteAuthorEl.textContent = `— ${selectedQuote.author}`;
        }

        // Event listener for button clicks/taps
        newQuoteBtn.addEventListener("click", displayRandomQuote);

        // Display an initial quote on page load
        displayRandomQuote();
    </script>

</body>
</html>
